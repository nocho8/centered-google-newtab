<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#20263e">
<title>New Tab</title>
<style>
  :root {
    --bg-top: #20263e;
    --bg-bottom: #1b2239;
    --text: #f1f3fa;
    --muted: #c0c5d3;
    --search-bg: #f5f6fa;
    --search-text: #30333b;
    --tile: #383d48;
    --tile-hover: #454b59;
    --accent: #8ab4f8;
    --line: rgba(202, 213, 240, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--text);
    font: 14px Arial, Helvetica, sans-serif;
    background:
      radial-gradient(ellipse at 50% 34%, rgba(75, 88, 133, .18), transparent 48%),
      linear-gradient(145deg, var(--bg-top) 0%, #222941 48%, var(--bg-bottom) 100%);
  }
  .top-links {
    position: absolute;
    top: 22px;
    right: 30px;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .top-links a {
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    opacity: .94;
  }
  .top-links a:hover { text-decoration: underline; }
  .apps {
    width: 30px; height: 30px; display: grid;
    grid-template-columns: repeat(3, 4px);
    grid-template-rows: repeat(3, 4px);
    gap: 3px; align-content: center; justify-content: center;
    border-radius: 50%;
  }
  .apps:hover { background: rgba(255,255,255,.1); }
  .apps i { width: 4px; height: 4px; border-radius: 50%; background: #e4e8f2; }
  .profile {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid #4285f4; padding: 2px;
    display: grid; place-items: center; color: #fff;
    font-weight: 700; font-size: 13px;
    background: linear-gradient(135deg, #e0a56e, #725b82);
  }
  main {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(105px, 17vh, 175px) 24px 55px;
  }
  .content { width: min(100%, 826px); text-align: center; }
  .logo {
    margin: 0 auto 30px;
    font-size: clamp(66px, 7vw, 88px);
    line-height: 1;
    font-weight: 500;
    letter-spacing: -5px;
    user-select: none;
    text-shadow: 0 2px 18px rgba(0,0,0,.12);
  }
  .blue { color: #8ab4f8; }
  .red { color: #f28b82; }
  .yellow { color: #fdd663; }
  .green { color: #81c995; }
  form { width: 100%; }
  .search {
    height: 62px;
    width: 100%;
    padding: 0 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-radius: 34px;
    background: var(--search-bg);
    box-shadow: 0 3px 14px rgba(0,0,0,.13);
    transition: box-shadow .16s, transform .16s;
  }
  .search:hover, .search:focus-within {
    box-shadow: 0 5px 22px rgba(0,0,0,.24);
    transform: translateY(-1px);
  }
  .search svg { color: #626875; flex: 0 0 auto; }
  input {
    flex: 1; min-width: 0; border: 0; outline: 0;
    background: transparent; color: var(--search-text);
    font: 16px Arial, Helvetica, sans-serif;
  }
  input::placeholder { color: #9da2ad; opacity: 1; }
  .shortcuts {
    margin: 24px auto 0;
    display: flex; justify-content: center; flex-wrap: wrap;
    gap: 14px; max-width: 650px;
  }
  .shortcut {
    width: 132px; min-height: 66px; padding: 10px 13px;
    border-radius: 17px; background: var(--tile);
    color: var(--text); text-decoration: none;
    display: flex; align-items: center; gap: 11px;
    text-align: left; transition: background .15s, transform .15s;
  }
  .shortcut:hover, .shortcut:focus-visible {
    background: var(--tile-hover); transform: translateY(-2px); outline: none;
  }
  .bubble {
    flex: 0 0 34px; width: 34px; height: 34px;
    display: grid; place-items: center; border-radius: 11px;
    background: rgba(255,255,255,.09); font-size: 16px; font-weight: 700;
  }
  .shortcut-label { font-size: 12px; line-height: 1.25; overflow-wrap: anywhere; }
  .hint { color: var(--muted); opacity: .65; font-size: 12px; margin-top: 22px; }
  @media (max-width: 600px) {
    .top-links { top: 16px; right: 16px; gap: 14px; }
    main { padding-top: 25vh; }
    .logo { margin-bottom: 24px; }
    .search { height: 56px; padding: 0 17px; }
    .shortcut { width: 116px; }
  }
  @media (max-height: 650px) {
    main { padding-top: 90px; }
    .logo { font-size: 60px; margin-bottom: 20px; }
    .search { height: 54px; }
    .shortcuts { margin-top: 18px; }
  }
</style>
</head>
<body>
  <nav class="top-links" aria-label="Google links">
    <a href="https://mail.google.com/">Gmail</a>
    <a href="https://images.google.com/">Images</a>
    <a class="apps" href="https://www.google.com/intl/en/about/products" aria-label="Google apps">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </a>
    <span class="profile" aria-label="Profile">G</span>
  </nav>
  <main>
    <section class="content" aria-label="Google search">
      <div class="logo" aria-label="Google">
        <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
      </div>
      <form action="https://www.google.com/search" method="get" role="search">
        <div class="search">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/>
            <path d="m16 16 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input name="q" type="search" placeholder="Search Google or type a URL" aria-label="Search Google" autocomplete="off" autofocus>
        </div>
      </form>
      <nav class="shortcuts" aria-label="Shortcuts">
        <a class="shortcut" href="https://www.youtube.com/"><span class="bubble" style="color:#ff777f">▶</span><span class="shortcut-label">YouTube</span></a>
        <a class="shortcut" href="https://mail.google.com/"><span class="bubble" style="color:#8ab4f8">M</span><span class="shortcut-label">Gmail</span></a>
        <a class="shortcut" href="https://drive.google.com/"><span class="bubble" style="color:#81c995">▲</span><span class="shortcut-label">Drive</span></a>
        <a class="shortcut" href="https://www.reddit.com/"><span class="bubble" style="color:#ff9b70">r/</span><span class="shortcut-label">Reddit</span></a>
      </nav>
      <div class="hint">Press Enter to search</div>
    </section>
  </main>
  <script>
    document.querySelector('input[name="q"]').focus({preventScroll:true});
  </script>
</body>
</html>
